tags:
  - name: widgets
    description: Widget related endpoints
paths:
  '/v1/widgets/{id}/{num}':
    get:
      tags:
        - widgets
      summary: Get a specific widget by ID.
      description: Get a specific widget by ID.
      operationId: widgetGet
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the widget.
          schema:
            type: string
        - name: num
          in: path
          required: true
          description: An integer in the path.
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: successful operation
  '/v1/widgets/{id}':
    delete:
      tags:
        - widgets
      summary: Delete a specific widget by ID.
      description: Delete a specific widget by ID.
      operationId: widgetDelete
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the widget.
          schema:
            type: string
      responses:
        '204':
          description: successful operation
