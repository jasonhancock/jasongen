tags:
  - name: widgets
    description: Widget related endpoints
paths:
  /v1/widgets:
    post:
      tags:
        - widgets
      summary: Create a widget.
      description: Creates a widget from an inline request body.
      operationId: WidgetCreate
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                count:
                  type: integer
                metadata:
                  type: object
                  description: free-form metadata
                tags:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Widget'
  /v1/widgets/bulk:
    post:
      tags:
        - widgets
      summary: Create many widgets.
      description: Creates widgets from an inline array request body.
      operationId: WidgetBulkCreate
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
      responses:
        '204':
          description: successful operation
  /v1/widgets/raw:
    post:
      tags:
        - widgets
      summary: Create a widget from free-form data.
      description: Creates a widget from a free-form request body.
      operationId: WidgetRawCreate
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '204':
          description: successful operation
components:
  schemas:
    Widget:
      type: object
      properties:
        name:
          type: string
