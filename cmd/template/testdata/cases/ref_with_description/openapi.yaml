components:
  schemas:
    Base:
      type: object
      required:
        - required_widget
      properties:
        # A bare $ref, for comparison.
        widget:
          $ref: '#/components/schemas/Widget'
        # OpenAPI 3.1 allows keywords alongside a $ref. These must generate the
        # same types as a bare $ref.
        described_widget:
          $ref: '#/components/schemas/Widget'
          description: "A widget with a description"
        required_widget:
          $ref: '#/components/schemas/Widget'
          description: "A required widget with a description"
        described_color:
          $ref: '#/components/schemas/Color'
          description: "An enum with a description"
        described_widgets:
          type: array
          items:
            $ref: '#/components/schemas/Widget'
            description: "Array items with a description"
    Color:
      type: string
      enum:
        - red
        - blue
    Widget:
      required:
        - id
      type: object
      properties:
        id:
          type: string
          description: "The id of the widget"
          example: "w1234"
