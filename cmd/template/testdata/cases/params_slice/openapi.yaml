tags:
  - name: widgets
    description: Widget related endpoints
paths:
 /v1/widgets:
    get:
      tags:
        - widgets
      summary: Get a list of all widgets.
      description: Gets a list of all widgets
      operationId: WidgetsList
      parameters:
        - in: query
          name: names
          required: false
          explode: true
          schema:
            type: array
            items:
              type: string
        - in: query
          name: ids
          required: true
          explode: true
          schema:
            type: array
            items:
              type: integer
              format: uint32
        - in: query
          name: color
          required: false
          schema:
            $ref: '#/components/schemas/Color'
        - in: query
          name: sort_dir
          required: false
          schema:
            allOf:
              - type: string
            enum:
              - asc
              - desc
        - in: query
          name: start
          required: false
          schema:
            oneOf:
              - type: string
              - type: integer
                format: int64
      responses:
        '204':
          description: successful operation
components:
  schemas:
    Color:
      type: string
      enum:
        - red
        - blue
